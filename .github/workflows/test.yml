name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-latest   # the scripts use BSD date/ps and plutil
    steps:
      - uses: actions/checkout@v4
      - run: brew install shellcheck
      - run: shellcheck -S warning scripts/*.sh install.sh tests/run.sh
      - run: ./tests/run.sh
